type: object
properties:
  value:
    type: number
    format: double
    example: 47.95
    description: Valeur de l'indicateur
  bounds:
    $ref: ./Bounds.yaml
  growths:
    type: array
    items:
      $ref: ./Growth.yaml
    description: |
      Indicateurs de croissance de l'indicateur par rapport aux points précédents
      (présents uniquement lors d'une requête d'évolution)
example:
  value: 47.95
  bounds:
    min: 38.65
    low: 43.9
    mid: 47.95
    high: 52.35
    max: 59.43
  growths: [ ]
description: Indicateur
