  segments:
    type: array
    items:
      $ref: ./SocioeconomicIndicatorSegment.yaml
  marketingType:
    $ref: ./MarketingType.yaml
  propertyTypes:
    type: array
    items:
      $ref: ./PropertyType.yaml
  newBuild:
