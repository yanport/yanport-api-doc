type: object
required:
  - id
  - organizationId
  - userId
  - type
  - product
  - name
properties:
  id:
    type: string
    format: uuid
  organizationId:
    type: integer
    format: int64
  agencyId:
    type: integer
    format: int64
  mandataryNetworkId:
    type: integer
    format: int64
  userId:
    type: integer
    format: int64
  externalIds:
    type: object
    properties:
      USER:
        type: string
      AGENCY:
        type: string
  type:
    type: string
    enum:
      - ESTIMATION_STUDY
    description: Ce champ n'est pas requis sur l'ancien modèle d'étude
  product:
    $ref: ../ProductType.yaml
  name:
    type: string
  settings:
    $ref: ./Settings.yaml
  customer:
    deprecated: true
    allOf:
      - $ref: ./Customer.yaml
  property:
    deprecated: true
    allOf:
      - $ref: ../Property.yaml
  content:
    $ref: ./Content.yaml
  creationDate:
    type: string
    format: date-time
  updateDate:
    type: string
    format: date-time
  releaseDate:
    type: string
    format: date-time
  archiveDate:
    type: string
    format: date-time
