get:
  tags:
    - Indicateurs socioéconomiques
  summary: Valeur la plus récente d'un indicateur (taux de pauvreté, surface accessible, etc)
  description: >-
    Obtenir la valeur la plus récente d'un indicateur socioéconomique.


    ### Exemples
      #### Taux de pauvreté pour les familles sans enfants à Levallois-Perret
        /socioeconomic/indicators?type=POVERTY_RATE&segmentType=HOUSEHOLD_TYPE&segments=COUPLE_WITHOUT_CHILDREN&cityIds=54178039

      #### Les surfaces accessibles sur le marché de la location pour des appartments à Levallois-Perret pour les foyers venant du reste du département
        /socioeconomic/indicators?type=AFFORDABLE_SURFACE&segmentType=ZONE_OF_ORIGIN&segments=DEPARTMENT&marketingType=RENTS&propertyTypes=APARTMENT&newBuild=false&cityIds=54178039

  parameters:
    - $ref: ../components/parameters/SocioeconomicIndicatorQuery-type.yaml
    - $ref: ../components/parameters/SocioeconomicIndicatorQuery-segmentType.yaml
    - $ref: ../components/parameters/SocioeconomicIndicatorQuery-segments.yaml
    - $ref: ../components/parameters/SocioeconomicIndicatorQuery-marketingType.yaml
    - $ref: ../components/parameters/SocioeconomicIndicatorQuery-propertyTypes.yaml
    - $ref: ../components/parameters/SocioeconomicIndicatorQuery-newBuild.yaml
    - $ref: ../components/parameters/agglomerationIds.yaml
    - $ref: ../components/parameters/departments.yaml
    - $ref: ../components/parameters/cityIds.yaml
    - $ref: ../components/parameters/irisIds.yaml
    - $ref: ../components/parameters/zipCodes.yaml
    - $ref: ../components/parameters/SocioeconomicIndicatorQuery-frequency.yaml
  x-codeSamples:
    - lang: cURL
      label: poverty_rate
      source: |
        curl 'https://api.yanport.com/socioeconomic/indicators?type=POVERTY_RATE&segmentType=HOUSEHOLD_TYPE&segments=COUPLE_WITHOUT_CHILDREN&cityIds=54178039' \
        --header 'Authorization: Bearer YOUR_TOKEN'
    - lang: cURL
      label: affordable_surface_with_segment
      source: |
        curl 'https://api.yanport.com/socioeconomic/indicators?type=AFFORDABLE_SURFACE&segmentType=ZONE_OF_ORIGIN&segments=DEPARTMENT&marketingType=RENTS&propertyTypes=APARTMENT&newBuild=false&cityIds=54178039' \
        --header 'Authorization: Bearer YOUR_TOKEN'

  responses:
    '200':
      description: Indicateur
      content:
        application/json:
          schema:
            $ref: ../components/schemas/SocioeconomicIndicator.yaml
    '400':
      $ref: ../components/responses/BadRequest.yaml
    '500':
      $ref: ../components/responses/InternalServerError.yaml
